name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Cria uma chave de assinatura fixa na 1ª vez e guarda no repositório.
      # Assim o APK novo instala POR CIMA do antigo, sem perder o histórico.
      - name: Chave de assinatura fixa
        run: |
          if [ ! -f keystore/colagem.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/colagem.jks -storepass colagem123 -keypass colagem123 -alias colagem -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Colagem Shorts, O=Colagem, C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/colagem.jks
            git commit -m "Chave de assinatura do app [skip ci]"
            git push || echo "Aviso: não consegui salvar a chave no repositório"
          fi

      - name: Montar projeto Android
        run: |
          set -e
          SRC=$(find . -name "MainActivity.kt" -not -path "./build_app/*" -not -path "./.git/*" | head -n 1)
          if [ -z "$SRC" ]; then echo "ERRO: MainActivity.kt não encontrado no repositório"; exit 1; fi
          rm -rf build_app
          mkdir -p build_app/app/src/main/java/com/colagem/shorts
          mkdir -p build_app/app/src/main/res/drawable
          cp "$SRC" build_app/app/src/main/java/com/colagem/shorts/MainActivity.kt
          cd build_app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ColagemShorts"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.colagem.shorts"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.colagem.shorts"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = (System.currentTimeMillis() / 60000L).toInt()
                  versionName = "1.0"
              }
              signingConfigs {
                  create("fixa") {
                      storeFile = rootProject.file("../keystore/colagem.jks")
                      storePassword = "colagem123"
                      keyAlias = "colagem"
                      keyPassword = "colagem123"
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("fixa")
                  }
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("fixa")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Colagem Shorts"
                  android:icon="@drawable/ic_launcher"
                  android:largeHeap="true"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#3D5AFE" android:pathData="M18,0h72a18,18 0 0 1 18,18v72a18,18 0 0 1 -18,18h-72a18,18 0 0 1 -18,-18v-72a18,18 0 0 1 18,-18z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M24,22h28v36h-28z"/>
              <path android:fillColor="#FFD54F" android:pathData="M56,22h28v16h-28z"/>
              <path android:fillColor="#FF8A80" android:pathData="M56,42h28v16h-28z"/>
              <path android:fillColor="#80DEEA" android:pathData="M24,62h60v24h-60z"/>
          </vector>
          EOF

      - name: Compilar APK
        run: |
          cd build_app
          gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp build_app/app/build/outputs/apk/release/app-release.apk ColagemShorts.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ColagemShorts-APK
          path: ColagemShorts.apk
